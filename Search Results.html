<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>rbe.com — Search results</title>
<link rel="stylesheet" href="tokens.css" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Mono:wght@400;500&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" />
<style>
  html, body { margin: 0; padding: 0; background: #FAFAFA; }
  * { box-sizing: border-box; }
  body { font-family: 'Roboto', Arial, sans-serif; color: rgba(0,0,0,.87); }
  input, button { font-family: inherit; }
  a { cursor: pointer; }
  /* Tweaks panel */
  #tweaks {
    position: fixed; bottom: 20px; right: 20px; width: 280px;
    background: #fff; border-radius: 4px; padding: 16px;
    box-shadow: 0 5px 22px 0 rgba(0,0,0,.12), 0 8px 10px 1px rgba(0,0,0,.14), 0 5px 5px -3px rgba(0,0,0,.2);
    z-index: 9999; font-family: 'Roboto', Arial, sans-serif; display: none;
  }
  #tweaks.on { display: block; }
  #tweaks h6 { margin: 0 0 10px; font-size: 14px; font-weight: 500;
               color: rgba(0,0,0,.87); text-transform: uppercase; letter-spacing: .4px; }
  #tweaks .grp { margin-top: 12px; font-size: 12px; color: rgba(0,0,0,.6);
                 text-transform: uppercase; letter-spacing: .6px; margin-bottom: 6px; }
  #tweaks .opts { display: flex; gap: 4px; flex-wrap: wrap; }
  #tweaks .opt {
    padding: 6px 10px; border: 1px solid rgba(0,0,0,.23); border-radius: 4px;
    background: #fff; cursor: pointer; font-size: 13px; color: rgba(0,0,0,.87);
  }
  #tweaks .opt.on { border-color: #E87511; color: #E87511; background: rgba(232,117,17,.08); }
</style>
</head>
<body>
<div id="root"></div>

<div id="tweaks">
  <h6>Tweaks</h6>
  <div class="grp">View</div>
  <div class="opts" data-k="view">
    <div class="opt" data-v="list">List</div>
    <div class="opt" data-v="grid">Grid</div>
  </div>
  <div class="grp">Tab</div>
  <div class="opts" data-k="tab">
    <div class="opt" data-v="all">All</div>
    <div class="opt" data-v="auctions">Auctions</div>
    <div class="opt" data-v="buynow">Buy now</div>
  </div>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="components.jsx"></script>
<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="Placeholder.jsx"></script>
<script type="text/babel" src="SearchResultsScreen.jsx"></script>
<script type="text/babel">
  // Wait for all scripts to transpile
  setTimeout(() => {
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SearchResultsScreen />);
  }, 50);
</script>

<script>
  // Tweaks wiring
  (function() {
    let defaults = { view: 'list', tab: 'all' };
    const apply = (edits) => {
      defaults = { ...defaults, ...edits };
      document.querySelectorAll('#tweaks .opts').forEach(grp => {
        const k = grp.dataset.k;
        grp.querySelectorAll('.opt').forEach(o =>
          o.classList.toggle('on', o.dataset.v === defaults[k]));
      });
    };

    window.addEventListener('message', (e) => {
      const d = e.data || {};
      if (d.type === '__activate_edit_mode') document.getElementById('tweaks').classList.add('on');
      if (d.type === '__deactivate_edit_mode') document.getElementById('tweaks').classList.remove('on');
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');

    document.getElementById('tweaks').addEventListener('click', (e) => {
      const opt = e.target.closest('.opt');
      if (!opt) return;
      const grp = opt.closest('.opts');
      const k = grp.dataset.k, v = opt.dataset.v;
      apply({ [k]: v });
      // Dispatch a custom event so React can reach it via a prop-less channel:
      window.dispatchEvent(new CustomEvent('tweak', { detail: { k, v } }));
      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
    });

    apply(defaults);
  })();
</script>
</body>
</html>
